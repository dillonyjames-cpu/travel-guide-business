name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  crawler-files:
    name: Validate robots.txt and sitemap.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate crawler files
        run: |
          set -euo pipefail
          test -f public/robots.txt
          test -f public/sitemap.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('public/sitemap.xml')"
          grep -q "^Sitemap: https://wayasia.travel/sitemap.xml$" public/robots.txt
          urls=$(grep -c "<loc>https://wayasia.travel/" public/sitemap.xml)
          test "$urls" -ge 1
          echo "sitemap URLs: $urls"

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
